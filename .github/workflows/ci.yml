name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux — lint, types, tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Dépendances système (Qt offscreen, polices, FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libegl1 libgl1 libopengl0 libxkbcommon0 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0 fonts-dejavu-core
      - name: Installation
        run: python -m pip install -e '.[dev]'
      - name: Ruff (lint + format)
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Mypy
        run: python -m mypy src
      - name: Tests
        run: python -m pytest -q --junitxml=pytest-linux-${{ matrix.python }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-linux-${{ matrix.python }}
          path: pytest-linux-${{ matrix.python }}.xml

  windows:
    name: Windows — tests (Python 3.12)
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: FFmpeg (winget/choco)
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -version | Select-Object -First 1
      - name: Installation
        run: python -m pip install -e '.[dev]'
      - name: Tests
        run: python -m pytest -q --junitxml=pytest-windows.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-windows
          path: pytest-windows.xml

  windows-package:
    name: Windows — paquet PyInstaller et autotest du binaire
    runs-on: windows-latest
    needs: windows
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: FFmpeg (choco)
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: Installation (sans extras de test)
        run: |
          python -m pip install .
          python -m pip install "pyinstaller==6.22.3"
      - name: Construction du dossier distribuable + autotest du binaire
        run: python packaging/build.py --check
      - name: Export sans interface depuis le binaire (projet modèle)
        shell: pwsh
        run: |
          python -c "from antares_studio.app.main import create_app; create_app([]); from antares_studio.domain.model import Canvas; from antares_studio.persistence.store import ProjectStore; from antares_studio.resources.templates import create_project; ProjectStore().create('smoke', create_project('Smoke', Canvas(1280, 720, 30, 1), 'moon_phases', 1))"
          # exécutable fenêtré : PowerShell n'attend pas « & » ; Start-Process -Wait attend la fin de l'export
          $p = Start-Process -FilePath "dist/ANTARES Studio/ANTARES Studio.exe" -ArgumentList '--export','smoke.antares','smoke.mp4','--profile','draft_720p' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
          Get-Item smoke.mp4, smoke.credits.txt, smoke.mp4.manifest.json
      - name: Archive du dossier distribuable
        shell: pwsh
        run: Compress-Archive -Path "dist/ANTARES Studio" -DestinationPath "ANTARES-Studio-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ANTARES-Studio-windows-x64
          path: ANTARES-Studio-windows-x64.zip
          retention-days: 14
