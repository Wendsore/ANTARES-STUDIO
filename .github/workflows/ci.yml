name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux — lint, types, tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Dépendances système (Qt offscreen, polices, FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libegl1 libgl1 libopengl0 libxkbcommon0 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0 fonts-dejavu-core
      - name: Installation
        run: python -m pip install -e '.[dev]'
      - name: Ruff (lint + format)
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Mypy
        run: python -m mypy src
      - name: Tests
        run: python -m pytest -q --junitxml=pytest-linux-${{ matrix.python }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-linux-${{ matrix.python }}
          path: pytest-linux-${{ matrix.python }}.xml

  windows:
    name: Windows — tests (Python 3.12)
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: FFmpeg (winget/choco)
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -version | Select-Object -First 1
      - name: Installation
        run: python -m pip install -e '.[dev]'
      - name: Tests
        run: python -m pytest -q --junitxml=pytest-windows.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-windows
          path: pytest-windows.xml
