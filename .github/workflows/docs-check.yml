name: Documentation contract checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate documentation contracts
        run: python scripts/validate_docs.py
      - name: Run documentation-only tests
        run: python -m unittest discover -s tests -p 'test_documentation.py' -v
