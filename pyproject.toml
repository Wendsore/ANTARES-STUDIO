[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antares-studio"
version = "0.1.0.dev0"
description = "ANTARES Studio — Scientific Animation & Storytelling Studio (logiciel de bureau, vidéos scientifiques 2D/3D)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Licence non encore décidée — voir README"}
authors = [{name = "Wendsore"}]
dependencies = [
    "PySide6==6.12.0",
    "numpy>=2.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.11",
]
manim = [
    # Adaptateur d'export optionnel (ADR-0001) ; à installer dans un environnement séparé.
    "manim==0.22.0",
]

[project.scripts]
antares-studio = "antares_studio.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
antares_studio = ["py.typed", "resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ui: tests nécessitant Qt (exécutés avec QT_QPA_PLATFORM=offscreen)",
    "render: tests nécessitant ffmpeg/ffprobe",
    "slow: tests longs",
    "windows: tests à exécuter sur Windows réel",
]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["scripts/poc"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["N802", "N815"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["PySide6.*"]
ignore_missing_imports = true
